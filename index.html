<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>文枢 · 毛选概念宇宙（3D 漫游）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- 加载屏（数据就绪后淡出） -->
<div id="splash" role="status" aria-label="加载中">
  <div class="sp-logo">文枢 · 毛选概念宇宙</div>
  <div class="sp-sub">一人一宇宙 · 卷 / 篇 / 概念 三层语义空间</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-status" id="spStatus">正在生成概念星系…</div>
</div>

<!-- 首次操作引导 -->
<div id="guide">
  拖拽旋转 · 滚轮缩放 · 右键平移<br>
  <span>点击节点查看关系与溯源 · H 键隐藏界面</span>
</div>

<div id="hud">
  <div class="brand"><b>文枢 · 毛选概念宇宙</b><small>一人一宇宙 · 卷 / 篇 / 概念 三层语义空间</small></div>
  <div id="stat">加载中…</div>
</div>

<div id="legend"></div>

<div id="search">
  <input id="s" type="text" placeholder="搜索概念 / 篇目 / 人物…" />
  <div class="hint">回车聚焦 · 拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>

<div id="btns">
  <button id="bRotate">旋转：开</button>
  <button id="bReset">重置视角</button>
</div>

<div id="panel">
  <div class="hd">
    <span id="close">✕</span>
    <h3 id="pName"></h3>
    <span class="tag" id="pType"></span><span class="tag" id="pDeg"></span>
    <div class="desc" id="pDesc"></div>
  </div>
  <div class="body">
    <div class="cnt" id="pCnt"></div>
    <div id="pRels"></div>
  </div>
</div>

<div id="tip"></div>
<div id="gl"></div>

<!--__DATA__-->
<script type="module" src="./app.js"></script>
</body>
</html>
