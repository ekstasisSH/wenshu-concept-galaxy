<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>文枢 · 知识库具象化演示</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script data-goatcounter="https://ekstasissh.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- 加载屏（数据就绪后淡出） -->
<div id="splash" role="status" aria-label="加载中">
  <div class="sp-logo">文枢 · 知识库具象化演示</div>
  <div class="sp-sub">以《毛泽东选集》第1-4卷（1991年版）为例</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-status" id="spStatus">正在生成概念星系…</div>
</div>

<!-- 首次操作引导 -->
<div id="guide">
  拖拽旋转 · 滚轮缩放 · 右键平移<br>
  <span>点击节点查看关系与溯源 · H 键隐藏界面</span>
</div>

<div id="hud">
  <div class="brand"><b>文枢 · 知识库具象化演示</b><small>以《毛泽东选集》第1-4卷（1991年版）为例</small></div>
  <div id="stat">加载中…</div>
  <span id="visit">访客 <b id="busuanzi_value_site_uv">0</b> · 浏览 <b id="busuanzi_value_site_pv">0</b></span>
</div>

<div id="legend"></div>

<div id="search">
  <input id="s" type="text" placeholder="搜索概念 / 篇目 / 人物…" />
  <div class="hint">回车聚焦 · 拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>

<div id="btns">
  <button id="bRotate">旋转：开</button>
  <button id="bReset">重置视角</button>
</div>

<div id="panel">
  <div class="hd">
    <span id="close">✕</span>
    <h3 id="pName"></h3>
    <span class="tag" id="pType"></span><span class="tag" id="pDeg"></span>
    <div class="desc" id="pDesc"></div>
  </div>
  <div class="body">
    <div class="cnt" id="pCnt"></div>
    <div id="pRels"></div>
  </div>
</div>

<div id="tip"></div>
<div id="gl"></div>

<!--__DATA__-->
<script type="module" src="./app.js"></script>
</body>
</html>
